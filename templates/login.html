<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Nunito", sans-serif;
            background: #e9ecef;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* LOGIN PAGE */
        .login-container {
            background: linear-gradient(135deg, #ffffff, #f0f4f8);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.1);
            width: 400px;
            transform: translateY(-30px);
            transition: transform 0.3s ease-in-out;
        }

        .login-container:hover {
            transform: translateY(0px);
        }

        /* HEADER */
        .login-header {
            background: linear-gradient(93.12deg, #126f7b 0.52%, #1c8196 100%);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }

        .login-header h2 {
            color: white;
            font-size: 1.5rem;
            margin: 0;
        }

        /* INPUT FIELDS */
        input {
            padding: 12px;
            margin: 10px 0;
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 10px;
            background-color: #f9f9f9;
            font-size: 1rem;
            transition: border 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #0c7dbe;
            box-shadow: 0 0 5px rgba(12, 125, 190, 0.3);
        }

        /* LOGIN BUTTON */
        button {
            padding: 8px 20px;
            width: auto;
            background: linear-gradient(135deg, #4facfe, #00f2fe); /* عصري */
            border: none;
            border-radius: 30px;
            color: white;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.3s, transform 0.3s;
            display: block;
            margin: 15px auto;
        }

        button:hover {
            background: linear-gradient(135deg, #00d2ff, #3a7bd5); /* تأثير التمرير */
            transform: scale(1.1);
        }

        /* FOOTER */
        .login-footer {
            text-align: center;
            margin-top: 20px;
        }

        .login-footer a {
            color: #0c7dbe;
            text-decoration: none;
            font-weight: bold;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        /* Error message */
        .error-message {
            color: red;
            font-size: 0.9rem;
            text-align: center;
            margin-top: 10px;
            background-color: #ffe6e6;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid red;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h2>Voice-Enabled Chatbot</h2>
        </div>
        <form action="/login" method="post">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>

        <!-- Error message section -->
        {% if error %}
            <div class="error-message">
                {{ error }}
            </div>
        {% endif %}

        <div class="login-footer">
            <a href="#">Forgot Password?</a> | 
            <a href="/create_account">Create Account</a> <!-- رابط إنشاء حساب جديد -->
        </div>
    </div>
</body>
</html>
